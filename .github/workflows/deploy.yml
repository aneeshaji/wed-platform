name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Dist
        run: npm run build

      - name: Convert OG image SVG to PNG
        run: |
          npm install --no-save sharp
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svgBuffer = fs.readFileSync('./public/og-image.svg');
          sharp(svgBuffer)
            .resize(1200, 630)
            .png()
            .toFile('./dist/og-image.png')
            .then(() => console.log('og-image.png generated'))
            .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'sneha-sarath.wed.framezlabs.store/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
