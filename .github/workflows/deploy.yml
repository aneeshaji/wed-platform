name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  # Reads couples.json and emits the list of couples to deploy.
  # Adding a couple to couples.json → it deploys automatically.
  discover:
    name: Discover couples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build deploy matrix from couples.json (live couples only)
        id: set-matrix
        run: echo "matrix=$(jq -c '.couples | map(select(.status == "live")) | map({slug, serverDir})' couples.json)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & Deploy ${{ matrix.couple.slug }} to cPanel
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        couple: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Dist (${{ matrix.couple.slug }})
        env:
          VITE_COUPLE: ${{ matrix.couple.slug }}
        run: npm run build

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          timeout: 60000
          server-dir: ${{ matrix.couple.serverDir }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: verbose
