<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="55%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#0f0502" />
    </radialGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)" />
  
  <!-- Floating Petals & Sparkles -->
  <circle cx="80" cy="90" r="6" fill="#fbbf24" opacity="0.8" />
  <circle cx="320" cy="120" r="5" fill="#fef08a" opacity="0.9" />
  <circle cx="50" cy="350" r="7" fill="#f59e0b" opacity="0.7" />
  <circle cx="350" cy="380" r="6" fill="#fbbf24" opacity="0.8" />
  
  <!-- Decorative Marigold Garland Ring -->
  <circle cx="200" cy="210" r="135" fill="none" stroke="url(#amber)" stroke-width="6" stroke-dasharray="12 8" opacity="0.75" />
  
  <!-- Couple Haldi Caricature Illustration -->
  <g transform="translate(200, 205) scale(0.95)">
    <!-- Groom Avatar in Yellow Kurta -->
    <g transform="translate(-45, -35)">
      <path d="M-25,-30 Q0,-55 25,-30 Q30,-10 20,10 Q0,20 -20,10 Z" fill="#1e1b2e" />
      <path d="M-18,-15 Q0,-25 18,-15 Q22,15 0,30 Q-22,15 -18,-15 Z" fill="#fde047" opacity="0.9" />
      <!-- Haldi smudges on cheeks -->
      <circle cx="-10" cy="8" r="4" fill="#eab308" opacity="0.9" />
      <circle cx="10" cy="8" r="4" fill="#eab308" opacity="0.9" />
      <!-- Eyes & Big Smile -->
      <circle cx="-7" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="7" cy="-2" r="2.5" fill="#0f172a" />
      <path d="M-7,10 Q0,18 7,10" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
      <!-- Yellow Kurta -->
      <path d="M-30,30 L30,30 L35,80 L-35,80 Z" fill="#f59e0b" />
    </g>
    
    <!-- Bride Avatar in Yellow Lehenga -->
    <g transform="translate(45, -30)">
      <!-- Marigold in Hair -->
      <circle cx="18" cy="-12" r="14" fill="#fbbf24" />
      <path d="M-25,-25 Q0,-50 25,-25 Q30,-5 20,15 Q0,25 -20,15 Z" fill="#1e1b2e" />
      <path d="M-18,-12 Q0,-22 18,-12 Q20,16 0,28 Q-20,16 -18,-12 Z" fill="#fde047" opacity="0.9" />
      <!-- Haldi smudges on cheeks -->
      <circle cx="-10" cy="8" r="4" fill="#eab308" opacity="0.9" />
      <circle cx="10" cy="8" r="4" fill="#eab308" opacity="0.9" />
      <circle cx="0" cy="-10" r="2.5" fill="#dc2626" />
      <circle cx="-7" cy="-1" r="2.5" fill="#0f172a" />
      <circle cx="7" cy="-1" r="2.5" fill="#0f172a" />
      <path d="M-7,11 Q0,19 7,11" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
      <!-- Yellow Lehenga -->
      <path d="M-28,28 L28,28 L35,80 L-35,80 Z" fill="#fef08a" />
      <path d="M-15,28 L20,80 L28,80 L-5,28 Z" fill="#f59e0b" />
    </g>
  </g>
  
  <!-- Banner Text -->
  <rect x="60" y="380" width="280" height="46" rx="23" fill="rgba(35, 15, 5, 0.9)" stroke="url(#amber)" stroke-width="1.5" />
  <text x="200" y="408" font-family="serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="3">HALDI &amp; RITUALS</text>
  <text x="200" y="450" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle" letter-spacing="2">BLESSINGS &amp; JOY</text>
</svg>
