<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b1d60" />
      <stop offset="60%" stop-color="#190d30" />
      <stop offset="100%" stop-color="#0a0515" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg1)" />
  
  <circle cx="60" cy="80" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="340" cy="110" r="5" fill="#f472b6" opacity="0.8" />
  <circle cx="80" cy="380" r="6" fill="#fde047" opacity="0.7" />
  <circle cx="320" cy="400" r="4" fill="#a78bfa" opacity="0.8" />
  
  <circle cx="200" cy="210" r="135" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8 5" opacity="0.75" />
  <circle cx="200" cy="210" r="125" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  
  <!-- Caricature Silhouette & Couple Illustration -->
  <g transform="translate(200, 205) scale(0.95)">
    <!-- Groom Avatar -->
    <g transform="translate(-50, -40)">
      <path d="M-25,-30 Q0,-55 25,-30 Q30,-10 20,10 Q0,20 -20,10 Z" fill="#1e1b2e" />
      <path d="M-18,-15 Q0,-25 18,-15 Q22,15 0,30 Q-22,15 -18,-15 Z" fill="#fbcfe8" />
      <circle cx="-7" cy="-2" r="2.5" fill="#0f172a" />
      <circle cx="7" cy="-2" r="2.5" fill="#0f172a" />
      <path d="M-6,10 Q0,16 6,10" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" />
      <path d="M-30,30 L30,30 L35,80 L-35,80 Z" fill="#ffffff" />
      <path d="M-20,30 L-5,80 L5,80 L-10,30 Z" fill="url(#gold)" />
    </g>
    
    <!-- Bride Avatar -->
    <g transform="translate(50, -35)">
      <circle cx="20" cy="-10" r="18" fill="#1e1b2e" />
      <circle cx="22" cy="-10" r="14" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="4 3" />
      <path d="M-25,-25 Q0,-50 25,-25 Q30,-5 20,15 Q0,25 -20,15 Z" fill="#1e1b2e" />
      <path d="M-18,-12 Q0,-22 18,-12 Q20,16 0,28 Q-20,16 -18,-12 Z" fill="#fbcfe8" />
      <circle cx="0" cy="-10" r="2.5" fill="#dc2626" />
      <circle cx="-7" cy="-1" r="2.5" fill="#0f172a" />
      <circle cx="7" cy="-1" r="2.5" fill="#0f172a" />
      <path d="M-6,11 Q0,17 6,11" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" />
      <path d="M-28,28 L28,28 L35,80 L-35,80 Z" fill="#fef08a" />
      <path d="M-15,28 L20,80 L28,80 L-5,28 Z" fill="url(#gold)" />
      <path d="M-10,32 Q0,45 10,32" fill="none" stroke="url(#gold)" stroke-width="3" />
    </g>
    
    <!-- Joined Hands with Golden Ring -->
    <circle cx="0" cy="5" r="18" fill="url(#gold)" opacity="0.25" />
    <path d="M-12,25 C-25,-5 0,-25 0,0 C0,-25 25,-5 12,25 Z" fill="url(#rose)" opacity="0.9" />
    <text x="0" y="-5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✦</text>
  </g>
  
  <!-- Banner Text -->
  <rect x="60" y="380" width="280" height="46" rx="23" fill="rgba(15, 10, 30, 0.9)" stroke="url(#gold)" stroke-width="1.5" />
  <text x="200" y="408" font-family="serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="3">SAVE THE DATE</text>
  <text x="200" y="450" font-family="sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" letter-spacing="2">13 · 09 · 2026</text>
</svg>
